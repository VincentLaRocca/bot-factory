name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" pyflakes

      - name: Pyflakes
        run: python -m pyflakes agents aiop profiles reasoning store tests demo.py demo_asymmetry.py

      - name: Test
        run: python -m pytest -q
