[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiop"
version = "0.5.0"
description = "AIOP — a minimal core for AI-addressable objects, relations, state and provenance, with an object store, cluster layer, recomputable calculations, the Asymmetry Analyst and the Observer motherboard"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "bot-factory" }]
keywords = ["aiop", "json-ld", "provenance", "knowledge-graph"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/VincentLaRocca/bot-factory"

[tool.setuptools]
packages = [
    "agents",
    "agents.asymmetry",
    "aiop",
    "capabilities",
    "capabilities.anomaly",
    "observer",
    "profiles",
    "reasoning",
    "store",
]

[tool.setuptools.package-data]
aiop = ["context.jsonld"]
profiles = ["context.jsonld", "asymmetry-context.jsonld", "observer-context.jsonld"]
store = ["context.jsonld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
